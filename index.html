<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Technology evidence gap map</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg: #eef3fb;
    --panel: #ffffff;
    --panel-2: #e7eefb;
    --text: #0f2146;
    --muted: #3f5585;
    --accent: #1f4fb6;
    --border: #b7c8e7;
    --medium-col-width: clamp(96px, 11vw, 140px);
    --srl-col-width: clamp(108px, 13vw, 158px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: linear-gradient(180deg, #f2f7ff 0%, #eaf1fb 100%);
    color: var(--text);
  }
  .wrap { max-width: 1700px; margin: 0 auto; padding: 24px 24px 56px; }
  p.lead { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }
  .grid { display: block; }
  .panel {
    background: rgba(255, 255, 255, 0.97);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 10px 24px rgba(42, 68, 130, 0.16);
  }
  .filters-grid { row-gap: 8px; }
  .filters-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .filters-title {
    font-size: 15px;
    font-weight: 700;
    color: #132f66;
    margin: 0;
  }
  .filters-subtitle {
    color: #3f5687;
    font-size: 12px;
    margin: 2px 0 0;
  }
  .filters-toggle-btn {
    background: rgba(223, 234, 253, 0.98);
    border: 1px solid rgba(48, 89, 176, 0.52);
    color: #123774;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    line-height: 1.2;
    cursor: pointer;
  }
  .filters-toggle-btn:hover {
    background: rgba(219, 231, 252, 0.95);
  }
  .filter-group {
    margin-bottom: 0;
    border: 1px solid rgba(166, 186, 225, 0.95);
    border-radius: 12px;
    padding: 8px;
    background: rgba(240, 246, 255, 0.98);
  }
  .filter-group.is-collapsed {
    padding-bottom: 8px;
  }
  .filter-group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .filter-group-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #1f3f79;
    margin: 0;
  }
  .filter-group-toggle {
    border: 1px solid rgba(48, 89, 176, 0.52);
    background: rgba(223, 234, 253, 0.98);
    color: #123774;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 11px;
    line-height: 1.2;
    cursor: pointer;
    flex-shrink: 0;
  }
  .filter-group-toggle:hover {
    background: rgba(219, 231, 252, 0.95);
  }
  .filter-group-content.is-hidden {
    display: none;
  }
  .filter-list {
    max-height: 148px;
    overflow: auto;
    padding-right: 2px;
  }
  .filter-actions {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
    position: sticky;
    top: 0;
    padding: 2px 0 4px;
    background: rgba(240, 246, 255, 1);
    z-index: 1;
  }
  .filter-action-btn {
    border: 1px solid rgba(48, 89, 176, 0.52);
    background: rgba(223, 234, 253, 0.98);
    color: #123774;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 11px;
    line-height: 1.2;
    cursor: pointer;
  }
  .filter-action-btn:hover {
    background: rgba(219, 231, 252, 0.95);
  }
  .filter-option {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    margin-bottom: 3px;
    padding: 4px 6px;
    border-radius: 7px;
    transition: background 120ms ease;
  }
  .filter-option:hover {
    background: rgba(62, 105, 190, 0.2);
  }
  .filter-option input[type="checkbox"] {
    margin-top: 2px;
  }
  .filter-option-text {
    font-size: 12px;
    line-height: 1.2;
    color: #153162;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .year-row {
    display: grid;
    grid-template-columns: minmax(170px, 250px) minmax(170px, 250px);
    gap: 10px;
    max-width: 560px;
  }
  .small { font-size: 12px; color: var(--muted); }
  input[type="checkbox"] { transform: translateY(1px); }
  .matrix-wrap {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: auto;
    max-height: none;
    background: rgba(240, 246, 255, 0.95);
    -webkit-overflow-scrolling: touch;
    width: 100%;
  }
  .matrix-topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .matrix-hint {
    min-height: 18px;
    margin: 2px 0 8px;
    font-size: 12px;
    color: #2f4f8f;
    opacity: 0;
    transition: opacity 140ms ease;
  }
  .matrix-hint.show { opacity: 1; }
  .matrix-help {
    margin: 0 0 8px;
    font-size: 12px;
    color: #3c578a;
  }
  .matrix-pill {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    line-height: 1.2;
    color: var(--muted);
    background: rgba(226, 237, 255, 0.98);
  }
  .stats-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    background: rgba(226, 237, 255, 0.98);
    color: var(--muted);
  }
  .stats-toggle-label {
    font-size: 12px;
    padding: 0 6px 0 8px;
    color: #1f427d;
    white-space: nowrap;
  }
  .stats-toggle-btn {
    border: 1px solid rgba(48, 89, 176, 0.52);
    background: rgba(223, 234, 253, 0.98);
    color: #123774;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 11px;
    line-height: 1.2;
    cursor: pointer;
  }
  .stats-toggle-btn:hover {
    background: rgba(219, 231, 252, 0.95);
  }
  .stats-toggle-btn.active {
    background: rgba(56, 102, 197, 0.3);
    border-color: rgba(56, 102, 197, 0.62);
    color: #0f2f67;
  }
  .matrix-legend {
    display: flex;
    gap: 14px;
    align-items: center;
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .legend-color {
    width: 12px;
    height: 6px;
    border-radius: 2px;
  }
  .custom-tooltip {
    position: fixed;
    z-index: 9999;
    max-width: 440px;
    pointer-events: auto;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(54, 96, 188, 0.55);
    background: rgba(255, 255, 255, 0.98);
    color: #112d62;
    font-size: 12px;
    line-height: 1.35;
    box-shadow: 0 8px 24px rgba(42, 68, 130, 0.24);
    white-space: normal;
    display: none;
  }
  .tooltip-block + .tooltip-block {
    margin-top: 10px;
  }
  .tooltip-title {
    font-weight: 700;
    margin: 0 0 4px 0;
  }
  .tooltip-list {
    margin: 0;
    padding-left: 16px;
  }
  .tooltip-list li {
    margin: 0 0 2px 0;
  }
  .tooltip-link {
    color: #1348ad;
    text-decoration: underline;
  }
  .tooltip-link:hover {
    color: #0f377f;
  }
  .tooltip-empty {
    list-style: none;
    margin-left: -16px;
    color: #4f6898;
  }
  .matrix-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    min-width: 920px;
  }
  .matrix-table th,
  .matrix-table td {
    border: 1px solid var(--border);
    padding: 8px 7px;
    font-size: clamp(10px, 0.72vw, 12px);
    vertical-align: middle;
    overflow-wrap: anywhere;
    word-break: break-word;
    hyphens: auto;
  }
  .matrix-table th:nth-child(n+3),
  .matrix-table td:nth-child(n+3) {
    width: clamp(72px, 6.2vw, 98px);
    min-width: clamp(72px, 6.2vw, 98px);
  }
  .matrix-table th {
    background: rgba(220, 232, 252, 0.98);
    color: var(--text);
    position: sticky;
    top: 0;
    z-index: 4;
    font-weight: 700;
    text-align: center;
    line-height: 1.25;
    white-space: normal;
    overflow-wrap: normal;
    word-break: normal;
    hyphens: none;
    cursor: default;
  }
  .matrix-table th.method-header {
    cursor: pointer;
    overflow-wrap: anywhere;
    word-break: break-word;
    hyphens: auto;
  }
  .matrix-table th.method-header:hover {
    background: rgba(199, 216, 247, 0.98);
  }
  .matrix-table th.method-header.no-data-col,
  .matrix-table td.no-data-col {
    opacity: 0.42;
  }
  .matrix-table th:first-child {
    z-index: 4;
    background: rgba(220, 232, 252, 0.98);
    width: var(--medium-col-width);
    min-width: var(--medium-col-width);
    max-width: var(--medium-col-width);
  }
  .matrix-table td:first-child {
    z-index: 1;
    background: rgba(233, 242, 255, 1);
    width: var(--medium-col-width);
    min-width: var(--medium-col-width);
    max-width: var(--medium-col-width);
  }
  .matrix-table th:nth-child(2) {
    z-index: 4;
    background: rgba(220, 232, 252, 0.98);
    width: var(--srl-col-width);
    min-width: var(--srl-col-width);
    max-width: var(--srl-col-width);
  }
  .matrix-table td:nth-child(2) {
    z-index: 1;
    background: rgba(233, 242, 255, 1);
    width: var(--srl-col-width);
    min-width: var(--srl-col-width);
    max-width: var(--srl-col-width);
  }
  .matrix-table tbody tr:nth-child(even) td {
    background: rgba(53, 84, 156, 0.09);
  }
  .matrix-table tbody tr:nth-child(even) td:first-child {
    background: rgba(233, 242, 255, 1);
  }
  .matrix-table tbody tr:nth-child(even) td:nth-child(2) {
    background: rgba(233, 242, 255, 1);
  }
  .matrix-table tbody tr.row-group-start td {
    border-top-width: 2px;
    border-top-color: #7995cd;
  }
  .matrix-row-label {
    font-weight: 600;
    color: #1f3d76;
    white-space: normal;
    line-height: 1.3;
  }
  .matrix-medium-label {
    font-weight: 700;
    color: #16366f;
    white-space: normal;
    line-height: 1.25;
  }
  .cell-bars {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 24px;
    justify-content: center;
  }
  .cell-line {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px;
    align-items: center;
    padding: 2px 4px;
    border-radius: 6px;
    transition: background-color 120ms ease, outline-color 120ms ease;
  }
  .cell-line-positive { background: rgba(103, 182, 50, 0.08); }
  .cell-line-neutral { background: rgba(226, 164, 40, 0.08); }
  .cell-line-negative { background: rgba(209, 74, 63, 0.08); }
  .cell-line-positive:hover { background: rgba(103, 182, 50, 0.2); outline: 1px solid rgba(103, 182, 50, 0.45); }
  .cell-line-neutral:hover { background: rgba(226, 164, 40, 0.2); outline: 1px solid rgba(226, 164, 40, 0.45); }
  .cell-line-negative:hover { background: rgba(209, 74, 63, 0.2); outline: 1px solid rgba(209, 74, 63, 0.45); }
  .cell-track {
    height: 6px;
    background: rgba(23, 49, 103, 0.2);
    border-radius: 999px;
    overflow: hidden;
  }
  .cell-bar {
    height: 6px;
    border-radius: 2px;
    min-width: 0;
  }
  .cell-count {
    font-size: 10px;
    color: #214684;
    min-width: 26px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    display: inline-flex;
    align-items: center;
    justify-content: flex-end;
    gap: 5px;
  }
  .cell-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
    flex: 0 0 6px;
  }
  .cell-dot-positive { background: #67b632; }
  .cell-dot-neutral { background: #e2a428; }
  .cell-dot-negative { background: #d14a3f; }
  .cell-bar-positive { background: #67b632; }
  .cell-bar-negative { background: #d14a3f; }
  .cell-bar-neutral { background: #e2a428; }
  .cell-empty {
    color: var(--muted);
    opacity: 0.82;
    text-align: center;
    font-size: 11px;
  }
  .empty-state {
    color: var(--muted);
    font-size: 14px;
    padding: 12px 2px;
  }
  @media (max-width: 1200px) {
    .matrix-wrap { max-height: none; }
    .matrix-table { min-width: 840px; }
    :root {
      --medium-col-width: 88px;
      --srl-col-width: 102px;
    }
    .matrix-table th:nth-child(n+3),
    .matrix-table td:nth-child(n+3) {
      width: clamp(68px, 6.4vw, 90px);
      min-width: clamp(68px, 6.4vw, 90px);
    }
  }
  @media (max-width: 760px) {
    .wrap { padding: 12px 12px 40px; }
    .panel { padding: 12px; border-radius: 14px; }
    .year-row { grid-template-columns: 1fr; gap: 8px; }
    .matrix-wrap { max-height: none; }
    .matrix-table { min-width: 700px; }
    .matrix-table th,
    .matrix-table td { font-size: 10.5px; padding: 6px 5px; }
    :root {
      --medium-col-width: 78px;
      --srl-col-width: 94px;
    }
    .matrix-table th:nth-child(n+3),
    .matrix-table td:nth-child(n+3) {
      width: clamp(62px, 8vw, 82px);
      min-width: clamp(62px, 8vw, 82px);
    }
  }
</style>
</head>
<body>
  <div class="container-fluid wrap">
    <div class="row g-3">
      <div class="col-12">
        <div class="panel">
          <div class="filters-header">
            <div>
              <p class="filters-title">Filters</p>
              <p class="filters-subtitle">Refine visible studies and methods</p>
            </div>
            <button id="filtersToggleBtn" class="filters-toggle-btn" type="button" aria-expanded="true">Hide Filters</button>
          </div>
          <div id="filtersBody" class="row filters-grid">
            <div class="col-12 col-md-6">
              <div class="filter-group">
                <label>Study year range</label>
                <div class="year-row">
                  <div>
                    <label for="minYear">From</label>
                    <input id="minYear" type="range" min="2014" max="2023" value="2014" />
                    <div class="small" id="minYearLabel">2014</div>
                  </div>
                  <div>
                    <label for="maxYear">To</label>
                    <input id="maxYear" type="range" min="2014" max="2023" value="2023" />
                    <div class="small" id="maxYearLabel">2023</div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-12 col-sm-6 col-md-3 col-lg-3">
              <div class="filter-group"><label>Study type</label><div id="studyFilter"></div></div>
            </div>
            <div class="col-12 col-sm-6 col-md-3 col-lg-3">
              <div class="filter-group"><label>Adaptivity</label><div id="adaptFilter"></div></div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
              <div class="filter-group"><label>Technology specificity</label><div id="specFilter"></div></div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
              <div class="filter-group"><label>Medium</label><div id="mediumFilter"></div></div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
              <div class="filter-group"><label>Method</label><div id="methodFilter"></div></div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
              <div class="filter-group"><label>RL type</label><div id="rlFilter"></div></div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
              <div class="filter-group"><label>Results</label><div id="evidenceFilter"></div></div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="panel">
          <div id="matrixTopbar" class="matrix-topbar"></div>
          <div id="matrixHint" class="matrix-hint" aria-live="polite"></div>
          <div class="matrix-help">Tip: Click a bar to pin the tooltip, then click a paper title to open its DOI.</div>
          <div class="matrix-legend">
            <span class="legend-chip"><span class="legend-color" style="background:#67b632"></span>Positive</span>
            <span class="legend-chip"><span class="legend-color" style="background:#e2a428"></span>Neutral/mixed</span>
            <span class="legend-chip"><span class="legend-color" style="background:#d14a3f"></span>Negative</span>
          </div>
          <div id="chartGrid" class="matrix-wrap"></div>
        </div>
      </div>
    </div>
  </div>

const MIX_OF_ABOVE_LABEL = "mix of above types";
const METHOD_ORDER = [
  "Goal setting",
  "(SRL) instruction",
  "Differentiation",
  "Modelling",
  "Scaffolding - structure",
  "Collaboration",
  "Practice (try & fail)",
  "Feedback",
  "Assessment",
  "Prompting",
  "Reflection",
  "Scaffolding - fading",
  "Activation"
];
const MEDIUM_ORDER = [
  "Audio/Visual and Multimedia Tools",
  "Interactive Tools",
  "Conversational Tools",
  "Communication Tools",
  "Production Tools",
  "Immersive Tools",
  "Organizational Tools",
  "Measurement Tools",
  "Other"
];

function uniq(arr) {
  return [...new Set(arr.filter(v => v !== null && v !== undefined && String(v).trim() !== ""))];
}

function normalizeOrderLabel(value) {
  return String(value || "")
    .toLowerCase()
    .replace(/\s*-\s*/g, "-")
    .replace(/\s+/g, " ")
    .trim();
}

function buildOrderIndex(preferred) {
  const index = new Map();
  preferred.forEach((name, i) => {
    index.set(normalizeOrderLabel(name), i);
  });
  return index;
}

const METHOD_ORDER_INDEX = buildOrderIndex([
  ...METHOD_ORDER,
  "(try & fail)",
  "Scaffolding-structure",
  "Scaffolding-fading"
]);
const MEDIUM_ORDER_INDEX = buildOrderIndex(MEDIUM_ORDER);
const STUDY_ORDER_INDEX = buildOrderIndex([
  "Randomized Control Trial",
  "Quasi-experimental",
  "Pre-pilot",
  "Pre-post",
  "Quantitative",
  "Mixed methods",
  "Qualitative",
  "Unspecified/unclear"
]);

function sortByPreferredOrder(values, orderIndex) {
  return [...values].sort((a, b) => {
    const na = normalizeOrderLabel(a);
    const nb = normalizeOrderLabel(b);
    const ia = orderIndex.has(na) ? orderIndex.get(na) : Number.MAX_SAFE_INTEGER;
    const ib = orderIndex.has(nb) ? orderIndex.get(nb) : Number.MAX_SAFE_INTEGER;
    if (ia !== ib) return ia - ib;
    return String(a).localeCompare(String(b));
  });
}

function setFilterSelection(id, checked) {
  const el = document.getElementById(id);
  const boxes = [...el.querySelectorAll('input[type="checkbox"]')];
  let changed = false;
  boxes.forEach(box => {
    if (box.checked !== checked) {
      box.checked = checked;
      changed = true;
    }
  });
  if (changed) renderDashboard();
}

function initFilterGroupToggles() {
  const groups = [...document.querySelectorAll(".filter-group")];
  groups.forEach((group, idx) => {
    const title = group.firstElementChild;
    if (!title || title.tagName !== "LABEL") return;

    const existingContent = [...group.children].slice(1);
    const content = document.createElement("div");
    content.className = "filter-group-content";
    existingContent.forEach(node => content.appendChild(node));

    const header = document.createElement("div");
    header.className = "filter-group-header";
    title.classList.add("filter-group-title");

    const toggleBtn = document.createElement("button");
    toggleBtn.type = "button";
    toggleBtn.className = "filter-group-toggle";
    toggleBtn.id = `filterToggle_${idx}`;
    toggleBtn.textContent = "Hide";
    toggleBtn.setAttribute("aria-expanded", "true");
    toggleBtn.setAttribute("aria-controls", `${toggleBtn.id}_content`);
    content.id = `${toggleBtn.id}_content`;

    toggleBtn.addEventListener("click", () => {
      const isHidden = content.classList.toggle("is-hidden");
      group.classList.toggle("is-collapsed", isHidden);
      toggleBtn.textContent = isHidden ? "Show" : "Hide";
      toggleBtn.setAttribute("aria-expanded", String(!isHidden));
    });

    header.appendChild(title);
    header.appendChild(toggleBtn);

    group.innerHTML = "";
    group.appendChild(header);
    group.appendChild(content);
  });
}

function fillSelect(id, values, defaultCheckedFn = null) {
  const el = document.getElementById(id);
  el.classList.add("filter-list");
  el.innerHTML = "";

  const actions = document.createElement("div");
  actions.className = "filter-actions";

  const selectAllBtn = document.createElement("button");
  selectAllBtn.type = "button";
  selectAllBtn.className = "filter-action-btn";
  selectAllBtn.textContent = "Select all";
  selectAllBtn.addEventListener("click", () => setFilterSelection(id, true));

  const clearAllBtn = document.createElement("button");
  clearAllBtn.type = "button";
  clearAllBtn.className = "filter-action-btn";
  clearAllBtn.textContent = "Clear";
  clearAllBtn.addEventListener("click", () => setFilterSelection(id, false));

  actions.appendChild(selectAllBtn);
  actions.appendChild(clearAllBtn);
  el.appendChild(actions);

  values.forEach(v => {
    const optionId = id + "_" + String(v).replace(/\s+/g, "_").replace(/[^a-zA-Z0-9_]/g, "");
    const label = document.createElement("label");
    label.className = "filter-option";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.id = optionId;
    input.value = v;
    input.checked = defaultCheckedFn ? Boolean(defaultCheckedFn(v)) : true;
    const text = document.createElement("span");
    text.className = "filter-option-text";
    text.textContent = v;
    label.appendChild(input);
    label.appendChild(text);
    el.appendChild(label);
  });
}

function selectedValues(id) {
  const el = document.getElementById(id);
  return [...el.querySelectorAll('input[type="checkbox"]:checked')].map(c => c.value);
}

function initFilters() {
  fillSelect("studyFilter", uniq(PAPER_DATA.map(d => d["Study Label"])).sort());
  fillSelect("adaptFilter", uniq(PAPER_DATA.map(d => d["Adaptivity Label"])).sort());
  fillSelect("specFilter", uniq(PAPER_DATA.map(d => d["Specificity Label"])).sort());
  fillSelect("mediumFilter", uniq(ROW_DATA.map(d => d["Medium"])).sort());
  fillSelect("methodFilter", uniq(ROW_DATA.map(d => d["Method"])).sort());
  fillSelect(
    "rlFilter",
    uniq(PAPER_DATA.map(d => d["SRL type"]))
      .filter(v => classifySrlCategory(v) !== null)
      .sort()
  );
  fillSelect("evidenceFilter", ["Positive", "Neutral mixed", "Negative"]);
}

function getFiltered() {
  let minYear = Number(document.getElementById("minYear").value);
  let maxYear = Number(document.getElementById("maxYear").value);
  if (minYear > maxYear) [minYear, maxYear] = [maxYear, minYear];
  document.getElementById("minYearLabel").textContent = minYear;
  document.getElementById("maxYearLabel").textContent = maxYear;

  const studies = selectedValues("studyFilter");
  const adapts = selectedValues("adaptFilter");
  const specs = selectedValues("specFilter");
  const media = selectedValues("mediumFilter");
  const methods = selectedValues("methodFilter");
  const rls = selectedValues("rlFilter");
  const evidence = selectedValues("evidenceFilter").map(v => {
    const t = String(v || "").trim().toLowerCase();
    if (t.includes("positive")) return "positive";
    if (t.includes("negative")) return "negative";
    return "neutral";
  });

  const filteredPapers = PAPER_DATA.filter(d =>
    Number(d["Year"] || 0) >= minYear &&
    Number(d["Year"] || 0) <= maxYear &&
    studies.includes(d["Study Label"]) &&
    adapts.includes(d["Adaptivity Label"]) &&
    specs.includes(d["Specificity Label"]) &&
    rls.includes(d["SRL type"])
  );

  const paperSet = new Set(filteredPapers.map(d => String(d["PaperNo"])));
  const filteredRows = ROW_DATA.filter(d =>
    paperSet.has(String(d["PaperNo"])) &&
    media.includes(d["Medium"]) &&
    methods.includes(d["Method"])
  );

  const rowPaperSet = new Set(filteredRows.map(d => String(d["PaperNo"])));
  const finalPapers = filteredPapers.filter(d => rowPaperSet.has(String(d["PaperNo"])));
  return {
    papers: finalPapers,
    rows: filteredRows,
    selectedMedia: media,
    selectedMethods: methods,
    selectedEvidence: evidence
  };
}

function classifyEvidence(effectValue) {
  const v = String(effectValue || "").trim().toLowerCase();
  if (v.includes("negative") && !v.includes("positive")) return "negative";
  if (v.includes("positive")) return "positive";
  if (v.includes("negative")) return "negative";
  return "neutral";
}

function buildReference(paper) {
  const authors = String(paper["Authors"] || "").trim();
  const year = String(paper["Year"] || "").trim();
  const paperNo = String(paper["PaperNo"] || "").trim();
  if (authors && year) return `${authors} (${year})`;
  if (authors) return authors;
  if (year) return `Study (${year})`;
  return paperNo ? `Paper ${paperNo}` : "Unspecified source";
}

function toDoiUrl(rawDoi) {
  const doiRaw = String(rawDoi || "").trim();
  if (!doiRaw || doiRaw === "/") return "";
  const normalized = doiRaw.replace(/^https?:\/\/(dx\.)?doi\.org\//i, "").trim();
  if (!normalized || normalized === "/") return "";
  return `https://doi.org/${normalized}`;
}

function buildReferenceEntry(paper) {
  return {
    label: buildReference(paper),
    doiUrl: toDoiUrl(paper["DOI"])
  };
}

function formatRefList(refs) {
  if (!refs || !refs.length) return "  - No studies";
  return refs.map(r => {
    const label = String((r && r.label) || r || "").trim() || "Unspecified source";
    const doiUrl = String((r && r.doiUrl) || "").trim();
    return doiUrl ? `  - ${label} (${doiUrl})` : `  - ${label}`;
  }).join("\n");
}

function formatRefListHtml(refs) {
  if (!refs || !refs.length) return '<li class="tooltip-empty">No studies</li>';
  return refs.map(r => {
    const label = escapeHtml(String((r && r.label) || r || "").trim() || "Unspecified source");
    const doiUrl = escapeHtml(String((r && r.doiUrl) || "").trim());
    if (doiUrl) {
      return `<li><a class="tooltip-link" href="${doiUrl}" target="_blank" rel="noopener noreferrer">${label}</a></li>`;
    }
    return `<li>${label}</li>`;
  }).join("");
}

function classifySrlCategory(srlTypeValue) {
  const t = String(srlTypeValue || "").trim().toLowerCase();
  if (!t) return null;

  if (t.includes("metacognition") || t.includes("self-directed learning")) return null;
  if (t === MIX_OF_ABOVE_LABEL) return "Combination of both";

  const hasSrl =
    t.includes("self-regulation") ||
    t.includes("self regulation") ||
    /\bsrl\b/.test(t);
  const hasCoOrSsrl =
    t.includes("co-regulation") ||
    t.includes("co regulation") ||
    t.includes("socially shared") ||
    /\bcorl\b/.test(t) ||
    /\bssrl\b/.test(t);

  if (hasSrl && hasCoOrSsrl) return "Combination of both";
  if (hasCoOrSsrl) return "CoRL + SSRL";
  if (hasSrl) return "SRL";
  return null;
}

function normalizeStudyType(paper) {
  const study = String(paper["Study Label"] || paper["Study Design"] || paper["SD"] || "").trim();
  return study || "Unspecified/unclear";
}

function collectCellData(filtered, subRowMode = "srl") {
  const paperByNo = new Map(filtered.papers.map(p => [String(p["PaperNo"]), p]));
  const cellMap = new Map();
  const evidenceSet = new Set(filtered.selectedEvidence || []);

  filtered.rows.forEach(row => {
    const paper = paperByNo.get(String(row["PaperNo"]));
    if (!paper) return;

    const medium = row["Medium"] || "Unspecified/unclear";
    const method = row["Method"] || "Unspecified/unclear";
    const studyType = normalizeStudyType(paper);
    const srlCategory = classifySrlCategory(paper["SRL type"]);
    if (!srlCategory) return;
    const rowValue = subRowMode === "study" ? studyType : srlCategory;
    const evidence = classifyEvidence(paper["Effect on SRL"]);
    if (evidenceSet.size && !evidenceSet.has(evidence)) return;
    const key = `${medium}|||${rowValue}|||${method}`;

    if (!cellMap.has(key)) {
      cellMap.set(key, {
        medium,
        srlCategory,
        studyType,
        rowValue,
        method,
        positive: 0,
        negative: 0,
        neutral: 0,
        total: 0,
        refs: {
          positive: [],
          neutral: [],
          negative: []
        },
        refSeen: {
          positive: {},
          neutral: {},
          negative: {}
        }
      });
    }

    const entry = cellMap.get(key);
    entry[evidence] += 1;
    entry.total += 1;
    const refKey = String(paper["PaperNo"] || buildReference(paper));
    if (!entry.refSeen[evidence][refKey]) {
      entry.refSeen[evidence][refKey] = true;
      entry.refs[evidence].push(buildReferenceEntry(paper));
    }
  });

  const cells = [...cellMap.values()];
  return cells.sort((a, b) => {
    const left = `${a.medium} | ${a.rowValue} | ${a.method}`.toLowerCase();
    const right = `${b.medium} | ${b.rowValue} | ${b.method}`.toLowerCase();
    return left.localeCompare(right);
  });
}

function renderNoData() {
  const grid = document.getElementById("chartGrid");
  const topbar = document.getElementById("matrixTopbar");
  const hint = document.getElementById("matrixHint");
  hint.textContent = "";
  hint.classList.remove("show");
  topbar.innerHTML = "";
  grid.innerHTML = '<div class="empty-state">No data for current filters.</div>';
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

let methodSelectionSnapshot = new Set();
let hintTimer = null;
let statsMode = "count";
let subRowMode = "srl";

function showMatrixHint(text) {
  const hint = document.getElementById("matrixHint");
  if (!hint) return;
  hint.textContent = text;
  hint.classList.add("show");
  if (hintTimer) clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    hint.classList.remove("show");
  }, 2600);
}

function findFilterCheckboxByValue(filterId, value) {
  const boxes = [...document.querySelectorAll(`#${filterId} input[type="checkbox"]`)];
  return boxes.find(c => c.value === value) || null;
}

function safePercent(value, denominator) {
  if (!denominator || denominator <= 0) return 0;
  return (value / denominator) * 100;
}

function formatStatValue(value, mode) {
  if (mode === "count") return String(value);
  return `${value.toFixed(1)}%`;
}

function renderCombinationChart(filtered) {
  const cells = collectCellData(filtered, subRowMode);
  const scaleBaseline = {
    ...filtered,
    selectedEvidence: ["positive", "neutral", "negative"]
  };
  const baselineCells = collectCellData(scaleBaseline, subRowMode);
  const srlOrder = ["SRL", "CoRL + SSRL", "Combination of both"];
  const studyTypes = sortByPreferredOrder(uniq(filtered.papers.map(p => normalizeStudyType(p))), STUDY_ORDER_INDEX);
  const rowValues = subRowMode === "study" ? studyTypes : srlOrder;
  const media = sortByPreferredOrder(filtered.selectedMedia, MEDIUM_ORDER_INDEX);
  const methods = sortByPreferredOrder(filtered.selectedMethods, METHOD_ORDER_INDEX);
  const rowDefs = [];

  media.forEach(medium => {
    rowValues.forEach(rowValue => {
      rowDefs.push({ medium, rowValue });
    });
  });

  if (!cells.length && !rowDefs.length) {
    renderNoData();
    return;
  }

  const grid = document.getElementById("chartGrid");
  const topbar = document.getElementById("matrixTopbar");
  const maxCount = Math.max(...baselineCells.map(c => Math.max(c.positive, c.negative, c.neutral)), 1);
  const wholeTotal = baselineCells.reduce((sum, c) => sum + c.total, 0);
  const columnTotals = new Map(methods.map(m => [m, 0]));
  const rowTotals = new Map();
  baselineCells.forEach(c => {
    columnTotals.set(c.method, (columnTotals.get(c.method) || 0) + c.total);
    const rowKey = `${c.medium}|||${c.rowValue}`;
    rowTotals.set(rowKey, (rowTotals.get(rowKey) || 0) + c.total);
  });

  const resolveDenominator = (method, rowKey) => {
    if (statsMode === "whole") return wholeTotal;
    if (statsMode === "column") return columnTotals.get(method) || 0;
    if (statsMode === "row") return rowTotals.get(rowKey) || 0;
    return wholeTotal;
  };

  const toDisplayValue = (count, method, rowKey) => {
    if (statsMode === "count") return count;
    return safePercent(count, resolveDenominator(method, rowKey));
  };

  const toDisplayWidth = (count, method, rowKey) => {
    if (statsMode === "count") {
      return Math.max((count / maxCount) * 100, count > 0 ? 8 : 0);
    }
    const pct = toDisplayValue(count, method, rowKey);
    return Math.max(pct, count > 0 ? 8 : 0);
  };

  const activeModeLabel = statsMode === "whole"
    ? "% Whole"
    : statsMode === "column"
      ? "% Column"
      : statsMode === "row"
        ? "% Row"
        : "Count";
  const totalPapers = cells.reduce((sum, c) => sum + c.total, 0);
  const totalPositive = cells.reduce((sum, c) => sum + c.positive, 0);
  const totalNegative = cells.reduce((sum, c) => sum + c.negative, 0);
  const totalNeutral = cells.reduce((sum, c) => sum + c.neutral, 0);
  const methodHasData = new Map(
    methods.map(m => [m, cells.some(c => c.method === m && c.total > 0)])
  );

  const currentSelection = new Set(methods);
  const newlyEnabledNoData = methods.filter(
    m => !methodSelectionSnapshot.has(m) && !methodHasData.get(m)
  );
  if (newlyEnabledNoData.length) {
    const shown = newlyEnabledNoData.slice(0, 2).join(", ");
    const extra = newlyEnabledNoData.length > 2 ? ` +${newlyEnabledNoData.length - 2}` : "";
    showMatrixHint(`No results for: ${shown}${extra}`);
  }
  methodSelectionSnapshot = currentSelection;

  topbar.innerHTML = [
    `<span class="stats-toggle" role="group" aria-label="Sub-row mode">` +
      `<span class="stats-toggle-label">Sub-rows</span>` +
      `<button type="button" class="stats-toggle-btn${subRowMode === "srl" ? " active" : ""}" data-subrow-mode="srl">SRL category</button>` +
      `<button type="button" class="stats-toggle-btn${subRowMode === "study" ? " active" : ""}" data-subrow-mode="study">Study type</button>` +
    `</span>`,
    `<span class="stats-toggle" role="group" aria-label="Statistics mode">` +
      `<span class="stats-toggle-label">Stats</span>` +
      `<button type="button" class="stats-toggle-btn${statsMode === "count" ? " active" : ""}" data-stat-mode="count">Count</button>` +
      `<button type="button" class="stats-toggle-btn${statsMode === "whole" ? " active" : ""}" data-stat-mode="whole">% Whole</button>` +
      `<button type="button" class="stats-toggle-btn${statsMode === "column" ? " active" : ""}" data-stat-mode="column">% Column</button>` +
      `<button type="button" class="stats-toggle-btn${statsMode === "row" ? " active" : ""}" data-stat-mode="row">% Row</button>` +
    `</span>`,
    `<span class="matrix-pill">Rows: ${rowDefs.length}</span>`,
    `<span class="matrix-pill">Methods: ${methods.length}</span>`,
    `<span class="matrix-pill">Combinations: ${cells.length}</span>`,
    `<span class="matrix-pill">Rows by: Medium + ${subRowMode === "study" ? "Study type" : "SRL category"}</span>`,
    `<span class="matrix-pill">View: ${activeModeLabel}</span>`,
    `<span class="matrix-pill">Papers: ${totalPapers}</span>`,
    `<span class="matrix-pill">Positive: ${totalPositive}</span>`,
    `<span class="matrix-pill">Neutral/mixed: ${totalNeutral}</span>`,
    `<span class="matrix-pill">Negative: ${totalNegative}</span>`
  ].join("");

  const cellMap = new Map();
  cells.forEach(c => {
    const key = `${c.medium}|||${c.rowValue}|||${c.method}`;
    cellMap.set(key, c);
  });

  let html = '<table class="matrix-table" role="table" aria-label="Evidence matrix">';
  html += `<thead><tr><th>Medium</th><th>${subRowMode === "study" ? "Study type" : "SRL category"}</th>`;
  methods.forEach(method => {
    const noDataClass = methodHasData.get(method) ? "" : " no-data-col";
    html += `<th class="method-header${noDataClass}" data-method="${escapeHtml(method)}">${escapeHtml(method)}</th>`;
  });
  html += "</tr></thead><tbody>";

  media.forEach((medium, mediumIndex) => {
    rowValues.forEach((rowValue, rowIndex) => {
      const rowClass = mediumIndex > 0 && rowIndex === 0 ? "row-group-start" : "";
      html += `<tr class="${rowClass}">`;

      if (rowIndex === 0) {
        html += `<td class="matrix-medium-label" rowspan="${rowValues.length}">${escapeHtml(medium)}</td>`;
      }

      html += `<td class="matrix-row-label">${escapeHtml(rowValue)}</td>`;

      methods.forEach(method => {
        const key = `${medium}|||${rowValue}|||${method}`;
        const rowKey = `${medium}|||${rowValue}`;
        const cell = cellMap.get(key);
        const tdClass = methodHasData.get(method) ? "" : ' class="no-data-col"';
        if (!cell || cell.total === 0) {
          html += `<td${tdClass}><div class="cell-empty">-</div></td>`;
        } else {
          const positiveWidth = toDisplayWidth(cell.positive, method, rowKey);
          const negativeWidth = toDisplayWidth(cell.negative, method, rowKey);
          const neutralWidth = toDisplayWidth(cell.neutral, method, rowKey);
          const positiveValue = toDisplayValue(cell.positive, method, rowKey);
          const neutralValue = toDisplayValue(cell.neutral, method, rowKey);
          const negativeValue = toDisplayValue(cell.negative, method, rowKey);
          const positiveDisplay = formatStatValue(positiveValue, statsMode);
          const neutralDisplay = formatStatValue(neutralValue, statsMode);
          const negativeDisplay = formatStatValue(negativeValue, statsMode);
          const positiveList = formatRefList(cell.refs.positive);
          const neutralList = formatRefList(cell.refs.neutral);
          const negativeList = formatRefList(cell.refs.negative);
          const positiveListHtml = formatRefListHtml(cell.refs.positive);
          const neutralListHtml = formatRefListHtml(cell.refs.neutral);
          const negativeListHtml = formatRefListHtml(cell.refs.negative);
          const denominator = resolveDenominator(method, rowKey);
          const tip = `Total papers: ${cell.total}\nPositive: ${cell.positive} (${safePercent(cell.positive, denominator).toFixed(1)}%)\nNeutral/mixed: ${cell.neutral} (${safePercent(cell.neutral, denominator).toFixed(1)}%)\nNegative: ${cell.negative} (${safePercent(cell.negative, denominator).toFixed(1)}%)\n\nPositive studies:\n${positiveList}\n\nNeutral/mixed studies:\n${neutralList}\n\nNegative studies:\n${negativeList}`;
          const positiveTip = `Positive (${cell.positive}, ${safePercent(cell.positive, denominator).toFixed(1)}%)\nStudies:\n${positiveList}`;
          const neutralTip = `Neutral/mixed (${cell.neutral}, ${safePercent(cell.neutral, denominator).toFixed(1)}%)\nStudies:\n${neutralList}`;
          const negativeTip = `Negative (${cell.negative}, ${safePercent(cell.negative, denominator).toFixed(1)}%)\nStudies:\n${negativeList}`;
          const tipHtml = `<div class="tooltip-block"><p class="tooltip-title">Total papers: ${cell.total}</p><p>Positive: ${cell.positive} (${safePercent(cell.positive, denominator).toFixed(1)}%)<br>Neutral/mixed: ${cell.neutral} (${safePercent(cell.neutral, denominator).toFixed(1)}%)<br>Negative: ${cell.negative} (${safePercent(cell.negative, denominator).toFixed(1)}%)</p></div><div class="tooltip-block"><p class="tooltip-title">Positive studies</p><ul class="tooltip-list">${positiveListHtml}</ul></div><div class="tooltip-block"><p class="tooltip-title">Neutral/mixed studies</p><ul class="tooltip-list">${neutralListHtml}</ul></div><div class="tooltip-block"><p class="tooltip-title">Negative studies</p><ul class="tooltip-list">${negativeListHtml}</ul></div>`;
          const positiveTipHtml = `<div class="tooltip-block"><p class="tooltip-title">Positive (${cell.positive}, ${safePercent(cell.positive, denominator).toFixed(1)}%)</p><ul class="tooltip-list">${positiveListHtml}</ul></div>`;
          const neutralTipHtml = `<div class="tooltip-block"><p class="tooltip-title">Neutral/mixed (${cell.neutral}, ${safePercent(cell.neutral, denominator).toFixed(1)}%)</p><ul class="tooltip-list">${neutralListHtml}</ul></div>`;
          const negativeTipHtml = `<div class="tooltip-block"><p class="tooltip-title">Negative (${cell.negative}, ${safePercent(cell.negative, denominator).toFixed(1)}%)</p><ul class="tooltip-list">${negativeListHtml}</ul></div>`;
          html += `<td${tdClass} data-tooltip="${escapeHtml(tip)}" data-tooltip-html="${escapeHtml(tipHtml)}" aria-label="${escapeHtml(tip)}"><div class="cell-bars">`;
          html += `<div class="cell-line cell-line-positive" data-tooltip="${escapeHtml(positiveTip)}" data-tooltip-html="${escapeHtml(positiveTipHtml)}" aria-label="${escapeHtml(positiveTip)}"><div class="cell-track"><div class="cell-bar cell-bar-positive" style="width:${positiveWidth}%"></div></div><span class="cell-count">${positiveDisplay}<span class="cell-dot cell-dot-positive" aria-hidden="true"></span></span></div>`;
          html += `<div class="cell-line cell-line-neutral" data-tooltip="${escapeHtml(neutralTip)}" data-tooltip-html="${escapeHtml(neutralTipHtml)}" aria-label="${escapeHtml(neutralTip)}"><div class="cell-track"><div class="cell-bar cell-bar-neutral" style="width:${neutralWidth}%"></div></div><span class="cell-count">${neutralDisplay}<span class="cell-dot cell-dot-neutral" aria-hidden="true"></span></span></div>`;
          html += `<div class="cell-line cell-line-negative" data-tooltip="${escapeHtml(negativeTip)}" data-tooltip-html="${escapeHtml(negativeTipHtml)}" aria-label="${escapeHtml(negativeTip)}"><div class="cell-track"><div class="cell-bar cell-bar-negative" style="width:${negativeWidth}%"></div></div><span class="cell-count">${negativeDisplay}<span class="cell-dot cell-dot-negative" aria-hidden="true"></span></span></div>`;
          html += "</div></td>";
        }
      });

      html += "</tr>";
    });
  });

  html += "</tbody></table>";
  grid.innerHTML = html;
}

function renderDashboard() {
  const filtered = getFiltered();
  renderCombinationChart(filtered);
}

const customTooltip = document.createElement("div");
customTooltip.id = "customTooltip";
customTooltip.className = "custom-tooltip";
document.body.appendChild(customTooltip);
let tooltipPinned = false;

function showCustomTooltip(text, x, y) {
  customTooltip.textContent = text;
  customTooltip.style.display = "block";
  const padding = 14;
  const rect = customTooltip.getBoundingClientRect();
  let left = x + 14;
  let top = y + 14;
  if (left + rect.width > window.innerWidth - padding) left = x - rect.width - 14;
  if (top + rect.height > window.innerHeight - padding) top = y - rect.height - 14;
  if (left < padding) left = padding;
  if (top < padding) top = padding;
  customTooltip.style.left = `${left}px`;
  customTooltip.style.top = `${top}px`;
}

function showCustomTooltipHtml(html, x, y) {
  customTooltip.innerHTML = html;
  customTooltip.style.display = "block";
  const padding = 14;
  const rect = customTooltip.getBoundingClientRect();
  let left = x + 14;
  let top = y + 14;
  if (left + rect.width > window.innerWidth - padding) left = x - rect.width - 14;
  if (top + rect.height > window.innerHeight - padding) top = y - rect.height - 14;
  if (left < padding) left = padding;
  if (top < padding) top = padding;
  customTooltip.style.left = `${left}px`;
  customTooltip.style.top = `${top}px`;
}

function hideCustomTooltip() {
  customTooltip.style.display = "none";
}

let hideTooltipTimer = null;
function scheduleHideTooltip(delayMs) {
  if (tooltipPinned) return;
  if (hideTooltipTimer) clearTimeout(hideTooltipTimer);
  hideTooltipTimer = setTimeout(() => {
    if (!tooltipPinned && !customTooltip.matches(":hover")) hideCustomTooltip();
  }, delayMs);
}

function showTooltipFromTarget(target, x, y) {
  const tooltipHtml = target.getAttribute("data-tooltip-html") || "";
  const tooltipText = target.getAttribute("data-tooltip") || "";
  if (tooltipHtml) {
    showCustomTooltipHtml(tooltipHtml, x, y);
  } else {
    showCustomTooltip(tooltipText, x, y);
  }
}

customTooltip.addEventListener("mouseenter", () => {
  if (hideTooltipTimer) clearTimeout(hideTooltipTimer);
});
customTooltip.addEventListener("mouseleave", () => {
  if (!tooltipPinned) hideCustomTooltip();
});
customTooltip.addEventListener("click", (event) => {
  event.stopPropagation();
});

["minYear", "maxYear", "studyFilter", "adaptFilter", "specFilter", "mediumFilter", "methodFilter", "rlFilter", "evidenceFilter"].forEach(id => {
  document.getElementById(id).addEventListener("input", renderDashboard);
  document.getElementById(id).addEventListener("change", renderDashboard);
});

const filtersToggleBtn = document.getElementById("filtersToggleBtn");
const filtersBody = document.getElementById("filtersBody");
filtersToggleBtn.addEventListener("click", () => {
  const isHidden = filtersBody.classList.toggle("d-none");
  filtersToggleBtn.textContent = isHidden ? "Show Filters" : "Hide Filters";
  filtersToggleBtn.setAttribute("aria-expanded", String(!isHidden));
});

document.getElementById("chartGrid").addEventListener("click", (event) => {
  const header = event.target.closest("th[data-method]");
  if (header) {
    const method = header.getAttribute("data-method") || "";
    const checkbox = findFilterCheckboxByValue("methodFilter", method);
    if (!checkbox) return;
    checkbox.checked = !checkbox.checked;
    renderDashboard();
    return;
  }

  const target = event.target.closest("[data-tooltip], [data-tooltip-html]");
  if (!target) {
    tooltipPinned = false;
    hideCustomTooltip();
    return;
  }

  if (hideTooltipTimer) clearTimeout(hideTooltipTimer);
  tooltipPinned = true;
  showTooltipFromTarget(target, event.clientX, event.clientY);
});

document.getElementById("chartGrid").addEventListener("mousemove", (event) => {
  if (tooltipPinned) return;
  if (hideTooltipTimer) clearTimeout(hideTooltipTimer);
  const target = event.target.closest("[data-tooltip], [data-tooltip-html]");
  if (!target) {
    scheduleHideTooltip(80);
    return;
  }
  showTooltipFromTarget(target, event.clientX, event.clientY);
});

document.getElementById("chartGrid").addEventListener("mouseleave", () => scheduleHideTooltip(140));
document.addEventListener("click", (event) => {
  if (!tooltipPinned) return;
  const insideTooltip = !!event.target.closest("#customTooltip");
  const insideTooltipTarget = !!event.target.closest("#chartGrid [data-tooltip], #chartGrid [data-tooltip-html]");
  if (insideTooltip || insideTooltipTarget) return;
  tooltipPinned = false;
  hideCustomTooltip();
});
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  tooltipPinned = false;
  hideCustomTooltip();
});
document.getElementById("matrixTopbar").addEventListener("click", (event) => {
  const subrowBtn = event.target.closest("button[data-subrow-mode]");
  if (subrowBtn) {
    const nextSubMode = subrowBtn.getAttribute("data-subrow-mode") || "study";
    if (nextSubMode !== subRowMode) {
      subRowMode = nextSubMode;
      renderDashboard();
    }
    return;
  }
  const btn = event.target.closest("button[data-stat-mode]");
  if (!btn) return;
  const nextMode = btn.getAttribute("data-stat-mode") || "count";
  if (nextMode === statsMode) return;
  statsMode = nextMode;
  renderDashboard();
});

let resizeTimer = null;
window.addEventListener("resize", () => {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderDashboard, 160);
});

initFilters();
initFilterGroupToggles();
methodSelectionSnapshot = new Set(selectedValues("methodFilter"));
renderDashboard();
</script>
</body>
</html>
